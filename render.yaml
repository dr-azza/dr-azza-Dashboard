# Render Blueprint for the QC test deployment: one free web service that runs the API and serves
# the web app from the same URL (first-party session cookie, no CORS). The database is Neon.
# Secrets are entered in the Render dashboard, never committed: DATABASE_URL (Neon) and the secret
# file `catalyst_deploy_key`. SEED_STAFF_PASSWORD is generated by Render (see its Environment tab).
services:
  - type: web
    name: azzah-test
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Shows the "Test environment" banner on every page.
      - key: VITE_APP_ENV
        value: test
      - key: DATABASE_URL
        sync: false
      - key: ALLOW_DEMO_SEED
        value: 'true'
      - key: SEED_STAFF_PASSWORD
        generateValue: true
      # Render's disk is wiped on restart, so uploads are kept in the database.
      - key: STORAGE_DRIVER
        value: database
      - key: WEB_DIST
        value: ../web/dist
      # Render's load balancer sits in front of the app.
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: CATALYST_KIT_REPO
        value: git@github.com:ahm-hossam/azzah-catalyst-kit.git
