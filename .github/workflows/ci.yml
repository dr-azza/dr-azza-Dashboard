name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: azzah
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: azzah_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U azzah -d azzah_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://azzah:ci_only@localhost:5432/azzah_test?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      # The web app needs the licensed Catalyst UI Kit, which is not in the repository,
      # so CI checks everything else. Run `pnpm typecheck && pnpm build` locally before merging web changes.
      - name: Typecheck (all packages except web)
        run: pnpm turbo run typecheck --filter='!@azza/web'

      - name: Test (all packages except web)
        run: pnpm turbo run test --filter='!@azza/web'

      - name: Integration tests (API against PostgreSQL)
        run: |
          pnpm --filter @azza/api exec prisma migrate deploy
          pnpm --filter @azza/api exec vitest run test/integration
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Build (all packages except web)
        run: pnpm turbo run build --filter='!@azza/web'

      # Vercel's function runtime can't require() ES-module-only packages, so the API ships there as
      # one bundle. This loads it the same way (require(esm) off) to catch a regression before deploy.
      - name: Serverless bundle loads without require(esm)
        run: |
          pnpm --filter @azza/api bundle:serverless
          node --no-experimental-require-module apps/api/scripts/check-serverless-bundle.cjs
