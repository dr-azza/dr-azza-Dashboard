<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8edeb" />
    <script>
      // Apply saved theme and language before first paint (keep in sync with src/lib/theme.ts and src/i18n).
      ;(function () {
        var root = document.documentElement
        try {
          var theme = localStorage.getItem('theme')
          var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          if (localStorage.getItem('lang') === 'ar') {
            root.lang = 'ar'
            root.dir = 'rtl'
          }
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AZZAH</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
